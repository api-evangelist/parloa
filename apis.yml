apis:
- aid: parloa:parloa-agent-management-platform
  name: Parloa Agent Management Platform (AMP)
  description: The Parloa Agent Management Platform (AMP) is the primary product surface for designing, testing, scaling,
    optimizing, and securing AI voice and chat agents for contact centers. AMP supports custom REST API integrations to external
    systems such as CRM, ERP, and workforce management platforms, and uses SIP for telephony interoperability. Access to the
    underlying APIs is provisioned via Parloa customer and partner accounts.
  humanURL: https://docs.amp.parloa.com/
  tags:
  - Agents
  - AMP
  - Conversational AI
  - Voice
  properties:
  - type: Documentation
    url: https://docs.amp.parloa.com/
  - type: ReleaseNotes
    url: https://docs.amp.parloa.com/getting-started/release-notes
- aid: parloa:parloa-custom-rest-services
  name: Parloa Custom REST Services Integration
  description: Parloa AMP can be extended with custom services exposed over REST that the AI agent calls during a conversation
    to retrieve customer data from CRM systems, look up orders, verify identity, or trigger downstream actions. The customer
    operates and authenticates these services; Parloa orchestrates calls from within a conversation flow.
  humanURL: https://www.parloa.com/platform/integrations/
  tags:
  - Custom Services
  - Integrations
  - REST
  - Tools
  properties:
  - type: Documentation
    url: https://www.parloa.com/platform/integrations/
