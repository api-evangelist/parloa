aid: parloa
name: Parloa
description: Parloa is an enterprise conversational AI platform for contact centers that automates voice and chat customer
  interactions across industries including financial services, utilities, eCommerce, healthcare, media, and IT. The Parloa
  Agent Management Platform (AMP) supports designing, testing, scaling, optimizing, and securing AI agents that integrate
  with CCaaS, telephony, CRM, and ERP systems. Parloa is a sales-led enterprise product and developer access to its REST APIs
  and integration tooling is provided through customer and partner accounts rather than a fully public developer portal.
